[package]
name = "matoakaui"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-log = "2.8.0"
# The facade the plugin routes; used directly wherever the shell has
# something worth reading in a log rather than showing the owner.
log = "0.4"
# For ResizeDirection only. Tauri takes it in the public signature of
# Window::start_resize_dragging but does not re-export it, so the one
# way to name that argument is to depend on the crate it comes from.
tauri-runtime = "2"
tauri-plugin-store = "2.4.3"
cloud-key = { path = "../../agent-core/cloud-key" }
hyper = "1"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
tokio = { version = "1", features = ["sync", "time"] }
gtk = "0.18"

[dev-dependencies]
# For the ignored live-gateway test only (cargo test -- --ignored).
tokio = { version = "1", features = ["sync", "rt", "macros"] }

